name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone PulsePlay executable
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name PulsePlay app.py
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsePlay-Windows-Setup
          path: |
            dist/PulsePlay-Setup.exe
            dist/PulsePlay.exe
          if-no-files-found: error
          retention-days: 30
      - name: Create rolling Windows release
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --target $env:GITHUB_SHA --title "PulsePlay для Windows" --notes "Установщик Windows x64. Sunshine/Moonlight ставятся отдельно через мастер первого запуска."
      - name: Upload rolling release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest dist/PulsePlay-Setup.exe dist/PulsePlay.exe --clobber

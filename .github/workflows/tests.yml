name: Tests
on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q app.py core.py help_ui.py launch.pyw network.py
      - name: Run unit tests
        run: python -m unittest -v
